<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十班 · 成长记录册</title><style>
:root{--ink:#263b39;--muted:#82908b;--green:#267969;--bg:#f4f6f2;--line:#e5eae4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 14px}button:hover{border-color:var(--green);background:#edf5ef}button:disabled{opacity:.5;cursor:wait}input,select,textarea{border:1px solid #dce3dd;border-radius:8px;padding:9px;background:white;color:var(--ink)}textarea{width:100%;min-height:90px}aside{position:fixed;width:220px;background:#fff;height:100vh;padding:34px 22px;border-right:1px solid var(--line)}.logo{font-size:22px;font-weight:750;letter-spacing:2px}.logo small{display:block;font-size:11px;letter-spacing:3px;color:var(--muted);margin:8px 0 36px}nav button{display:block;border:0;width:100%;text-align:left;margin:9px 0;padding:13px 16px;background:transparent}nav button.active{background:#eaf3ed;color:var(--green);font-weight:700}.sidefoot{position:absolute;bottom:30px;color:var(--muted);font-size:12px}main{margin-left:220px;max-width:1500px;padding:32px 44px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:29px;margin:9px 0}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px}p{color:var(--muted);margin:5px 0 20px}.eyebrow{font-size:11px;color:var(--green);letter-spacing:2px;font-weight:700}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#1a6658;color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:18px 24px}.stat strong{font-size:30px;margin-right:12px}.stat span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}.grid .card{margin:0}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{background:#f7f9f5;font-size:14px}.badge{padding:4px 9px;background:#edf4ef;color:var(--green);border-radius:6px;font-size:12px}.amber{background:#fbf1df;color:#a47731}.lessons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.lessons button{text-align:left;background:#f8faf7}.lessons small{display:block;color:var(--muted);font-size:11px}.empty{text-align:center;padding:35px;color:var(--muted)}.entry{padding:16px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.entry small{color:var(--muted)}.entry p{margin:6px 0;color:#596b64}.link{border:0;padding:3px 7px;color:var(--green);background:transparent;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.studentgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}.studentgrid label{border:1px solid var(--line);padding:8px;border-radius:8px;cursor:pointer}.studentgrid input{margin-right:7px}dialog{border:0;border-radius:16px;padding:28px;width:min(640px,94vw);max-height:90vh;color:var(--ink);box-shadow:0 25px 100px #1234}dialog::backdrop{background:#182b2866;backdrop-filter:blur(3px)}label.field{display:block;margin:16px 0 6px;font-size:13px;color:#62746c}.notice{padding:13px 17px;background:#eef4e9;border-radius:10px;margin:16px 0;color:#5c7256}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#263b39;color:white;padding:12px 24px;border-radius:10px;z-index:9}.hidden{display:none!important}.report{background:white;padding:28px;margin-top:20px}.report table{width:100%;border-collapse:collapse;font-size:13px}.report td,.report th{padding:10px;border:1px solid #ddd;text-align:left}.report h2{margin-top:24px}.report-person{page-break-after:always}.report-person:last-child{page-break-after:auto}.sub{font-size:12px;color:var(--muted)}@media(max-width:800px){aside{position:static;width:auto;height:auto;padding:15px}.logo small,.sidefoot{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto;margin:3px}main{margin:0;padding:22px 16px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.lessons{grid-template-columns:repeat(4,1fr)}}@media print{body{background:white}aside,.no-print,dialog,.toast{display:none!important}main{margin:0;padding:0;max-width:none}#content>*:not(.report){display:none!important}.report{padding:0;margin:0}.report-person{break-after:page}tr{break-inside:avoid}}
</style><body><aside><div class="logo">◈ 十班成长册<small>CLASS GROWTH JOURNAL</small></div><nav id="nav"></nav><div class="sidefoot">记录日常，看见成长<br>初二（10）班 · 班主任工作台<br><span id="sync">正在连接云端…</span></div></aside><main><div class="top no-print"><span class="eyebrow">每一份成长，都值得被看见</span><span class="badge">私密班级档案</span></div><div id="content"></div></main><dialog id="modal"></dialog><div id="toast" class="toast hidden"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const now=()=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit'}).format(new Date());
let data={students:[],records:[]},etag=null,page='今日记录',day=today(),busy=false,ready=false,selected=[],current=null,editing=null,archiveStudent='',from='',to='',reportIds=[];
const timetable=[[],['英语','音乐','语文','数学','地理','生物','体育','班会'],['英语','语文','数学','物理','历史','体育','道德与法治','—'],['科学','体育','数学','数学','语文','劳技','英语','—'],['道德与法治','语文','物理','科学','数学','生物','英语','体育'],['体育','英语','地理','语文','数学','历史','物理','—'],[]];
const types={'日常情况':['带零食','书包未按要求摆放','乱扔垃圾','同学冲突','其他情况'],'班级贡献与表扬':['帮助同学','值日认真','运动会志愿服务','主动承担班级事务','其他表扬'],'进步表现':['到班改善','课堂进步','行为改善','其他进步']};
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4500)}


let accessToken=sessionStorage.getItem('journal-access')||'';
async function api(body){let r=await fetch('https://vnsxarboholsdjavgcxv.supabase.co/functions/v1/journal-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,token:accessToken})});let b=await r.json();if(b.unauthorized){ready=false;accessToken='';sessionStorage.removeItem('journal-access');loginUI()}if(b.error)throw Error(b.error);return b}
function loginUI(){document.querySelector('#content').innerHTML='<h1>班级成长册</h1><p>输入班级密码，查看和记录学生成长。</p><form id="auth" class="card"><label class="field">访问密码</label><input id="password" type="password" required autocomplete="current-password"><div class="toolbar"><button class="primary">进入班级</button></div><p id="authmsg"></p></form>';document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();try{let b=await api({action:'login',password:document.querySelector('#password').value});accessToken=b.token;sessionStorage.setItem('journal-access',accessToken);await load()}catch(e){document.querySelector('#authmsg').textContent=e.message}}}
async function load(){if(!accessToken){loginUI();return}try{let b=await api({action:'read'});data=b.data;etag=b.version;ready=true;document.querySelector('#sync').textContent='● 云端已同步';render()}catch(e){toast(e.message)}}
async function save(next){if(busy||!ready)return false;busy=true;try{let b=await api({action:'save',payload:next,expected:etag});etag=b.version;data=next;document.querySelector('#sync').textContent='● 已保存到云端';return true}catch(e){toast(e.message);return false}finally{busy=false}}
window.addEventListener('focus',()=>{if(ready&&!busy&&!document.querySelector('#modal').open)load()});
function go(p){if(!ready){loginUI();return}page=p;render()}function name(id){return data.students.find(s=>s.id===id)?.name||'已归档学生'}
function render(){ $('#nav').innerHTML=['今日记录','班级日志','学生档案','导出报告','学生管理'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${['▦','☷','♧','↗','⚙'][i]}　${p}</button>`).join('');let c=$('#content');if(page==='今日记录')home(c);if(page==='班级日志'||page==='学生档案')history(c);if(page==='导出报告')exportsPage(c);if(page==='学生管理')manage(c);}
function head(title,desc){return `<h1>${title}</h1><p>${desc}</p>`}function buttons(cat){return types[cat].map(t=>`<button class="chip" onclick="openEntry('${cat}','${t}')">＋ ${t}</button>`).join('')}
function home(c){let rs=data.records.filter(r=>r.date===day),lessons=timetable[new Date(day+'T12:00:00').getDay()];c.innerHTML=`<div class="top"><div>${head('今日班级记录','把平凡的一天，记成成长的足迹。')}</div><input aria-label="记录日期" type="date" value="${day}" onchange="day=this.value||today();render()"></div>${!data.students.length?'<div class="notice">从添加班级名单开始，即可点选学生记录。 <button class="link" onclick="go(\'学生管理\')">添加学生 →</button></div>':''}<div class="stats"><div class="stat"><strong>${rs.length}</strong><span>今日记录</span></div><div class="stat"><strong>${rs.filter(r=>r.tone==='积极表现').length}</strong><span>积极表现</span></div><div class="stat"><strong>${new Set(rs.map(r=>r.student)).size}</strong><span>已记录学生</span></div></div><div class="grid"><section class="card"><div class="row"><h2>◷ 晨检迟到</h2><span class="badge amber">7:35 后到班</span></div><p>记录实际进班时间，留住每一天的细节。</p><button class="primary" onclick="openEntry('晨检迟到','晨检迟到')">＋ 记录进班时间</button><div class="sub" style="margin-top:15px">今日 ${rs.filter(r=>r.category==='晨检迟到').length} 条晨检记录</div></section><section class="card"><h2>▤ 课堂表现</h2><div class="lessons">${lessons.length?lessons.map((s,i)=>`<button ${s==='—'?'disabled':''} onclick="openEntry('课堂表现','随意接话','第${i+1}节 ${s}')"><small>第 ${i+1} 节</small>${s}</button>`).join(''):'<p>今天没有常规课程</p>'}</div><button class="link" onclick="openEntry('课堂表现','其他表现','临时课程')">＋ 临时调课 / 其他课程</button></section><section class="card"><h2>☷ 日常情况</h2><p>及时记录，共同找到改善的方向。</p><div class="chips">${buttons('日常情况')}</div></section><section class="card"><h2>✧ 班级贡献与表扬</h2><p>看见善意、责任与每一次主动付出。</p><div class="chips">${buttons('班级贡献与表扬')}</div></section></div><section class="card" style="margin-top:20px"><h2>↗ 进步表现</h2><div class="chips">${buttons('进步表现')}</div></section><section class="card"><div class="row"><h2>今日足迹</h2><span class="sub">按发生时间排列</span></div>${entries(rs)}</section>`}
function entries(rs){return rs.length?rs.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(r=>`<div class="entry"><div class="row"><div><b>${esc(name(r.student))}</b>　<span class="badge ${r.tone==='需要关注'?'amber':''}">${esc(r.item)}</span></div><small>${r.date} ${esc(r.time)} ${esc(r.lesson)}</small></div><p>${esc(r.note||r.item)}</p>${r.follow?`<div class="sub">后续：${esc(r.follow)}</div>`:''}<div class="row"><small>${esc(r.category)} · ${esc(r.status)}</small><span><button class="link" onclick="editEntry('${r.id}')">编辑 / 跟进</button><button class="link" onclick="removeEntry('${r.id}')">删除</button></span></div></div>`).join(''):'<div class="empty">还没有记录。每一次观察，都是了解学生的开始。</div>'}
function studentChecks(ids,handler){return data.students.map(s=>`<label><input type="checkbox" value="${s.id}" ${ids.includes(s.id)?'checked':''} onchange="${handler}(this)">${esc(s.name)}</label>`).join('')}
function pick(el){selected=el.checked?[...selected,el.value]:selected.filter(x=>x!==el.value)}
function openEntry(cat,item,lesson='',record=null){if(!ready)return toast('请等待云端连接');if(!data.students.length){go('学生管理');return toast('请先添加学生名单')}editing=record?.id||null;current={cat,item,lesson};selected=record?[record.student]:[];let options=cat==='课堂表现'?['趴着睡觉','不记笔记','随意接话','积极发言','认真专注','其他表现']:(types[cat]||[item]);$('#modal').innerHTML=`<div class="row"><h2>${editing?'编辑与跟进':cat}</h2><button class="link" onclick="closeModal()">✕ 关闭</button></div><form id="entryForm"><label class="field">选择学生（可多选）</label><div class="studentgrid">${studentChecks(selected,'pick')}</div><label class="field">发生日期 / 时间</label><div class="toolbar"><input id="edate" required type="date" value="${record?.date||day}"><input id="etime" type="time" value="${record?.time||now()}"></div><label class="field">记录项目</label><select id="eitem">${options.map(o=>`<option ${o===item?'selected':''}>${o}</option>`).join('')}</select><select id="etone">${['需要关注','积极表现','普通纪事'].map(t=>`<option ${t===(record?.tone||(['班级贡献与表扬','进步表现'].includes(cat)?'积极表现':'需要关注'))?'selected':''}>${t}</option>`).join('')}</select>${cat==='课堂表现'?`<label class="field">节次与科目（调课可修改）</label><input id="elesson" value="${esc(lesson)}">`:''}<label class="field">具体表现 / 事情经过</label><textarea id="enote" placeholder="用具体行为描述，例如：数学课未经举手接话，提醒后停止。">${esc(record?.note||'')}</textarea><label class="field">核实状态</label><select id="estatus"><option ${record?.status==='已核实'?'selected':''}>已核实</option><option ${record?.status==='待核实'?'selected':''}>待核实</option></select><label class="field">教育处理与后续跟进</label><textarea id="efollow" placeholder="可以之后再来补充">${esc(record?.follow||'')}</textarea><label class="field">教师内部备注（不进入家长报告）</label><textarea id="eprivate">${esc(record?.private||'')}</textarea><button class="primary" id="submitEntry">保存记录</button></form>`;$('#modal').showModal();$('#entryForm').onsubmit=submitEntry;if(cat==='课堂表现')$('#eitem').onchange=()=>{$('#etone').value=['积极发言','认真专注'].includes($('#eitem').value)?'积极表现':'需要关注'};}
function closeModal(){if(!busy)$('#modal').close()}
async function submitEntry(e){e.preventDefault();if(busy)return;if(!selected.length)return toast('请选择至少一名学生');if(editing&&selected.length!==1)return toast('编辑时请选择一位学生');let r={category:current.cat,item:$('#eitem').value,date:$('#edate').value,time:$('#etime').value,lesson:$('#elesson')?.value||'',tone:$('#etone').value,note:$('#enote').value.trim(),status:$('#estatus').value,follow:$('#efollow').value.trim(),private:$('#eprivate').value.trim(),updated:new Date().toISOString()};if(r.category==='晨检迟到'&&!r.time)return toast('请填写实际进班时间');if(r.category==='晨检迟到'&&r.time<='07:35')return toast('此时间未晚于7:35，无需登记迟到');if(r.category==='晨检迟到')r.note=(r.note?r.note+'；':'')+'实际进班时间 '+r.time;let next=structuredClone(data);if(editing){let old=next.records.find(x=>x.id===editing);next.records[next.records.findIndex(x=>x.id===editing)]={...r,id:editing,student:selected[0],created:old.created,history:[...(old.history||[]),old]}}else selected.forEach(student=>next.records.push({...r,student,id:crypto.randomUUID(),created:new Date().toISOString()}));$('#submitEntry').disabled=true;if(await save(next)){$('#modal').close();render();toast('记录已保存到云端')}else $('#submitEntry').disabled=false}
function editEntry(id){let r=data.records.find(x=>x.id===id);openEntry(r.category,r.item,r.lesson,r)}async function removeEntry(id){if(!confirm('确定删除这条记录？'))return;let n=structuredClone(data);n.records=n.records.filter(r=>r.id!==id);if(await save(n)){render();toast('记录已删除')}}
function filters(){return `<div class="toolbar"><select onchange="archiveStudent=this.value;render()"><option value="">全部学生</option>${data.students.map(s=>`<option value="${s.id}" ${archiveStudent===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><input aria-label="开始日期" type="date" value="${from}" onchange="from=this.value;render()"><span>至</span><input aria-label="结束日期" type="date" value="${to}" onchange="to=this.value;render()"><button onclick="from='';to='';archiveStudent='';render()">重置</button></div>`}function filtered(){return data.records.filter(r=>(!archiveStudent||r.student===archiveStudent)&&(!from||r.date>=from)&&(!to||r.date<=to))}
function history(c){c.innerHTML=head(page,page==='学生档案'?'沿着时间线，看见每一位学生的表现与改变。':'汇集每天发生的事情，随时查找与补充。')+filters()+`<section class="card">${entries(filtered())}</section>`}
function manage(c){c.innerHTML=head('学生管理','一次添加班级名单，日常记录只需点选。')+`<section class="card"><h2>批量添加学生</h2><p>每行一个姓名，也可用逗号或空格分隔。已有同名学生不会重复添加。</p><textarea id="names" placeholder="粘贴学生姓名，每行一位"></textarea><button class="primary" onclick="addStudents()">添加到班级</button></section><section class="card"><h2>班级名单 · ${data.students.length} 人</h2><div class="chips">${data.students.map(s=>`<button onclick="archiveStudent='${s.id}';go('学生档案')">${esc(s.name)} ↗</button>`).join('')}</div></section><section class="card"><h2>资料备份</h2><p>备份包含全部记录和内部备注，请妥善保存。</p><button onclick="download('班级档案备份.json',JSON.stringify(data,null,2),'application/json')">下载完整备份</button></section>`}
async function addStudents(){let names=$('#names').value.split(/[\s,，、;；]+/).filter(Boolean);if(!names.length)return toast('请输入学生姓名');let next=structuredClone(data);let count=0;names.forEach(n=>{if(n.length<30&&!next.students.some(s=>s.name===n)){next.students.push({id:crypto.randomUUID(),name:n});count++}});if(await save(next)){render();toast('已添加 '+count+' 名学生')}}
function reportPick(el){reportIds=el.checked?[...reportIds,el.value]:reportIds.filter(x=>x!==el.value)}
function exportsPage(c){c.innerHTML=head('个人表现报告','选择学生和时间范围，生成用于家校沟通的记录。')+`<section class="card"><h2>1. 选择日期范围</h2><div class="toolbar"><input aria-label="报告开始日期" type="date" id="rfrom" value="${from}" onchange="from=this.value"><span>至</span><input aria-label="报告结束日期" type="date" id="rto" value="${to}" onchange="to=this.value"></div><h2>2. 选择学生</h2><div class="toolbar"><button onclick="reportIds=data.students.map(s=>s.id);render()">全选</button><button onclick="reportIds=[];render()">取消全选</button></div><div class="studentgrid">${studentChecks(reportIds,'reportPick')}</div><div class="notice">家长版不包含内部备注；默认排除待核实记录。发送前请预览，检查文字中是否提及其他学生姓名。</div><div class="toolbar"><button class="primary" onclick="previewReport()">生成报告预览</button><button onclick="exportCsv()">导出 Excel 可打开的 CSV</button><button onclick="printReport()">按学生分页打印 / 存为 PDF</button><button onclick="exportIndividuals()">批量导出个人报告</button></div></section><div id="reports" class="report hidden"></div>`}
function reportRecords(id){return data.records.filter(r=>r.student===id&&r.status==='已核实'&&(!from||r.date>=from)&&(!to||r.date<=to)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function validReport(){if(!reportIds.length){toast('请先选择学生');return false}if(from&&to&&from>to){toast('开始日期不能晚于结束日期');return false}return true}
function reportHtml(id){let rs=reportRecords(id);return `<section class="report-person"><h1>${esc(name(id))} · 个人表现记录</h1><p>初二（10）班 ｜ ${from||'全部日期'} 至 ${to||today()}</p>${['积极表现','需要关注','普通纪事'].map(t=>`<h2>${t}</h2><table><thead><tr><th>时间 / 场景</th><th>具体表现</th><th>处理与后续</th></tr></thead><tbody>${rs.filter(r=>r.tone===t).map(r=>`<tr><td>${r.date} ${esc(r.time)}<br>${esc(r.lesson||r.category)}</td><td>${esc(r.item)}${r.note?'<br>'+esc(r.note):''}</td><td>${esc(r.follow||'—')}</td></tr>`).join('')||'<tr><td colspan="3">本时段暂无此类记录</td></tr>'}</tbody></table>`).join('')}<p class="sub">本报告依据已核实的日常记录整理。未记录不代表未发生，供家校沟通参考。</p></section>`}
function previewReport(){if(!validReport())return;$('#reports').innerHTML=reportIds.map(reportHtml).join('');$('#reports').classList.remove('hidden');$('#reports').scrollIntoView({behavior:'smooth'})}
function printReport(){if(!validReport())return;previewReport();window.print()}
function download(file,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportCsv(){if(!validReport())return;const cell=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let rows=[['学生','日期','时间','类别','科目节次','表现性质','事项','内容','后续']];reportIds.forEach(id=>reportRecords(id).forEach(r=>rows.push([name(id),r.date,r.time,r.category,r.lesson,r.tone,r.item,r.note,r.follow])));download('学生表现明细.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function exportIndividuals(){if(!validReport())return;let files=reportIds.map(id=>({name:name(id)+'_个人表现.html',body:'<!doctype html><meta charset="utf-8"><title>个人表现记录</title><style>body{font:15px/1.7 sans-serif;padding:35px;color:#263b39}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:10px;text-align:left}h2{font-size:18px}p{color:#777}</style>'+reportHtml(id)}));downloadZip(files);toast('已打包个人报告，可分别打开打印或存为 PDF')}
function downloadZip(files){const enc=new TextEncoder(),parts=[],central=[];let offset=0;function u16(v){return [v&255,v>>>8&255]}function u32(v){return [v&255,v>>>8&255,v>>>16&255,v>>>24&255]}function crc(bytes){let c=0xffffffff;for(let b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}for(let f of files){let n=enc.encode(f.name),b=enc.encode(f.body),sum=crc(b);let local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(sum),...u32(b.length),...u32(b.length),...u16(n.length),...u16(0),...n]);parts.push(local,b);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(sum),...u32(b.length),...u32(b.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...n]));offset+=local.length+b.length}let size=central.reduce((a,b)=>a+b.length,0);let end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(size),...u32(offset),...u16(0)]);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([...parts,...central,end],{type:'application/zip'}));a.download='学生个人表现报告.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
render();load();
</script></body></html>
